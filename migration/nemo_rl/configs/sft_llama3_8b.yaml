# SFT Config — NeMo RL equivalent of finetune.py for Llama-3-8B
#
# Mapping from finetune.py CLI args:
#   --model-path models/llama/llama3_8b_instruct  → policy.model_name
#   --peft-scheme lora                            → policy.dtensor_cfg.lora_cfg.enabled=true
#   --rank 8 --alpha 8                            → policy.dtensor_cfg.lora_cfg.dim, .alpha
#   --tensor-parallel 1                           → policy.dtensor_cfg.tensor_parallel_size
#   --seq-length 2048                             → policy.max_total_sequence_length
#   --global-batch-size 8                         → policy.train_global_batch_size
#   --micro-batch-size 1                          → policy.train_micro_batch_size
#   --max-steps 25000                             → sft.max_num_steps
#   --lr 5e-6                                     → policy.optimizer.kwargs.lr
#   --dataset-root path/to/data                   → data.train.data_path
#   ThanhFinetuningDataModule
#     prompt_template: "Question: {i} Answer: {o}" → data.default.prompt_file
#     answer_only_loss: True                        → handled by sft_processor (default)

sft:
  max_num_epochs: 1
  max_num_steps: 25000

  val_period: 1000
  val_batches: 10
  val_global_batch_size: 8
  val_micro_batch_size: 1
  val_at_start: false
  val_at_end: true
  seed: 42

checkpointing:
  enabled: true
  checkpoint_dir: "experiments/sft_nemo_rl/llama3_8b"
  metric_name: "val:val_loss"
  higher_is_better: false
  keep_top_k: 3
  save_period: 5000
  checkpoint_must_save_by: null
  save_optimizer: true

policy:
  # HuggingFace model name OR local path to HF-format checkpoint
  # finetune.py used NeMo format; NeMo RL uses HF format directly
  model_name: "meta-llama/Meta-Llama-3-8B-Instruct"

  tokenizer:
    name: ${policy.model_name}
    # Replaces ThanhFinetuningDataModule prompt_template
    # Use a Jinja2 template string or path to a .jinja file
    # Example for "Question: {input} Answer: {output}" format:
    chat_template: "{% for message in messages %}{%- if message['role'] == 'user' %}{{' Question: ' + message['content'].strip() + ' Answer:'}}{%- elif message['role'] == 'assistant' %}{{' ' + message['content'].strip()}}{%- endif %}{% endfor %}"
    chat_template_kwargs: null

  train_global_batch_size: 8     # was --global-batch-size
  train_micro_batch_size: 1      # was --micro-batch-size
  max_total_sequence_length: 2048  # was --seq-length
  precision: "bfloat16"

  offload_optimizer_for_logprob: false

  dtensor_cfg:
    _v2: true
    enabled: true
    env_vars: {}
    cpu_offload: false
    sequence_parallel: false      # set true if tensor_parallel_size > 1
    activation_checkpointing: false
    tensor_parallel_size: 1       # was --tensor-parallel
    context_parallel_size: 1

    # LoRA — replaces recipe.peft in finetune.py
    # was: --peft-scheme lora --rank 8 --alpha 8
    lora_cfg:
      enabled: false              # set true for LoRA finetuning
      target_modules: []          # empty = all linear layers (match_all_linear=true)
      exclude_modules: []
      match_all_linear: true
      dim: 8                      # was --rank (LoRA rank)
      alpha: 32                   # was --alpha (note: NeMo 2 used alpha=rank, NeMo RL default is 32)
      dropout: 0.0
      dropout_position: "post"
      lora_A_init: "xavier"
      use_triton: true            # set false when tensor_parallel_size > 1

    automodel_kwargs: {}

  dynamic_batching:
    enabled: false

  sequence_packing:
    enabled: false

  make_sequence_length_divisible_by: ${policy.dtensor_cfg.tensor_parallel_size}
  max_grad_norm: 1.0

  optimizer:
    name: "torch.optim.AdamW"
    kwargs:
      lr: 5.0e-6                  # was --lr
      weight_decay: 0.1
      betas: [0.9, 0.98]
      eps: 1.0e-5
      foreach: false
      fused: false

  # Optional Megatron Core backend (faster for large models / multi-node)
  # Enable if you need FP8, expert parallelism, or PP
  megatron_cfg:
    enabled: false
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    sequence_parallel: false
    activation_checkpointing: false
    use_linear_ce_fusion_loss: true
    peft:
      enabled: false
      dim: 8
      alpha: 32

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  add_bos: true
  add_eos: true
  add_generation_prompt: false
  shuffle: true
  num_workers: 4

  # Custom JSONL dataset — replaces ThanhFinetuningDataModule
  # Format: {"task_name": "finetune", "messages": [{"role": "user", "content": "..."}, {"role": "assistant", "content": "..."}]}
  # OR use input_key/output_key for simple format:
  #   {"input": "Question: ...", "output": "Answer: ..."}
  train:
    data_path: "datasets/finetuned_datasets/train.jsonl"  # adjust path
    input_key: "input"
    output_key: "output"
    task_name: "finetune"

  validation:
    data_path: "datasets/finetuned_datasets/val.jsonl"    # adjust path
    input_key: "input"
    output_key: "output"
    task_name: "finetune"

  default:
    prompt_file: null
    system_prompt_file: null
    processor: "sft_processor"    # handles answer_only_loss automatically

logger:
  log_dir: "logs/sft_llama3_8b"
  wandb_enabled: false
  tensorboard_enabled: true
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  tensorboard:
    log_dir: "tb_logs/sft_llama3_8b"
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 2    # was --gpus-per-node
  num_nodes: 1
